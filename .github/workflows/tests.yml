name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q

      # Guards the exact invocation action.yml uses. Running cli.py as a
      # script instead strips its package context and breaks the relative
      # imports — a failure no unit test catches, because pytest imports the
      # package properly.
      - name: Entry point resolves the way the action invokes it
        shell: bash
        run: |
          export PYTHONPATH="$PWD/src"
          python -m traffic_archive.cli --help > /dev/null
          echo "entry point ok"

# Dogfooding: this repository archives its own traffic with its own action.
#
# It needs a PAT, not the built-in token. GITHUB_TOKEN cannot read the traffic
# API under any configuration: the endpoint requires administration access, and
# `administration` is not a grantable key in the Actions permissions block —
# GitHub rejects the workflow outright if you try. See README.
name: Archive traffic

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write       # to commit the archive back
  id-token: write       # to sign attestations via Sigstore
  attestations: write   # to store them on this repository

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Explain the skip rather than failing red
        if: env.TRAFFIC_TOKEN == ''
        run: |
          echo "::notice::TRAFFIC_TOKEN is not set, so there is nothing to archive."
          echo "Create a PAT (run 'traffic-archive --check' to validate it)"
          echo "and store it as the TRAFFIC_TOKEN secret."

      - uses: ./
        id: archive
        if: env.TRAFFIC_TOKEN != ''
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          repos: ${{ github.repository }}

      # When archiving fails, the cause is almost always the token, and the
      # three causes look identical from outside. Run the diagnostic here so
      # the answer — including GitHub's own X-Accepted-GitHub-Permissions
      # header — lands in this log instead of requiring a local run.
      - name: Diagnose the token
        if: failure() && steps.archive.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          export PYTHONPATH="$PWD/src"
          python -m traffic_archive.cli --check --repos "${{ github.repository }}" || true

      - name: Detect changes
        if: env.TRAFFIC_TOKEN != ''
        id: diff
        run: |
          git add traffic
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Attest BEFORE committing: the attestation binds the file hashes to this
      # workflow run, this commit of the archiving code, and this timestamp.
      # Anyone can then check that an archive file is workflow output rather
      # than a hand edit:
      #
      #   gh attestation verify traffic/<repo>/views.json \
      #     --repo <owner>/<archive-repo>
      #
      # This proves provenance, not truth — see "What this archive proves"
      # in the README for the precise claim.
      - name: Attest provenance of the archived data
        if: env.TRAFFIC_TOKEN != '' && steps.diff.outputs.changed == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            traffic/**/*.json
            traffic/**/*.csv

      - name: Commit
        if: env.TRAFFIC_TOKEN != '' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: archive traffic $(date -u +%F)"
          git push

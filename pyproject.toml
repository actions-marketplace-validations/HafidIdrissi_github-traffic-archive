[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-traffic-archive"
version = "1.2.1"
description = "Archive GitHub traffic data before the 14-day window discards it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["github", "traffic", "analytics", "github-actions", "self-hosted"]

[project.urls]
Homepage = "https://github.com/HafidIdrissi/github-traffic-archive"
Repository = "https://github.com/HafidIdrissi/github-traffic-archive"
Issues = "https://github.com/HafidIdrissi/github-traffic-archive/issues"
Changelog = "https://github.com/HafidIdrissi/github-traffic-archive/blob/main/CHANGELOG.md"

[project.scripts]
traffic-archive = "traffic_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
